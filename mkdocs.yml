# Course website, built from the Markdown files in this repository.
# Preview locally:  pip install -r docs-requirements.txt && mkdocs serve
# Published to GitHub Pages by .github/workflows/docs.yml on every push to main.
site_name: "5LSM0 Neural Networks for Computer Vision"
site_url: https://tue-aria.github.io/NNCV/
repo_url: https://github.com/TUE-ARIA/NNCV
repo_name: TUE-ARIA/NNCV
edit_uri: edit/main/

docs_dir: .                    # the whole repository; needs the same-dir plugin
# Keep code and local files out of the site; links to them go to GitHub (see hooks).
# Exclude by type: a catch-all `*` would also drop the theme's own CSS and JavaScript.
exclude_docs: |
  *.py
  *.sh
  *.env
  *.txt
  *.yml
  .env
  Dockerfile
  .dockerignore
  .gitignore
  .gitattributes
  /site/
  /topics/TEMPLATE.md
  /challenge-server/
  data/
  checkpoints/
  predictions/
  wandb/
  slurm/logs/

nav:
  - Home: README.md
  - Topics:
      - topics/README.md
      - 1. Introduction and preliminaries: topics/01-introduction/README.md
      - 2. Data-driven image classification: topics/02-image-classification/README.md
      - 3. Convolutional networks, segmentation and detection:
          - topics/03-cnns-segmentation/README.md
          - 3.1 Convolutional networks: topics/03-cnns-segmentation/1-convolutional-networks.md
          - 3.2 Semantic segmentation: topics/03-cnns-segmentation/2-segmentation.md
          - 3.3 Object detection: topics/03-cnns-segmentation/3-detection.md
      - 4. Transformers:
          - topics/04-transformers/README.md
          - 4.1 Attention and the transformer: topics/04-transformers/1-attention.md
          - 4.2 Vision transformers: topics/04-transformers/2-vision-transformers.md
      - 5. Model performance evaluation: topics/05-evaluation/README.md
      - 6. Self-supervised and transfer learning:
          - topics/06-self-supervised-learning/README.md
          - 6.1 Transfer learning: topics/06-self-supervised-learning/1-transfer-learning.md
          - 6.2 Predictive self-supervised learning: topics/06-self-supervised-learning/2-predictive-ssl.md
          - 6.3 Evaluating representations: topics/06-self-supervised-learning/3-evaluation.md
          - 6.4 Masked image modeling: topics/06-self-supervised-learning/4-masked-image-modeling.md
          - 6.5 Contrastive learning and self-distillation: topics/06-self-supervised-learning/5-contrastive-learning.md
          - 6.6 Weak supervision and vision-language models: topics/06-self-supervised-learning/6-weak-supervision.md
          - 6.7 Foundation models: topics/06-self-supervised-learning/7-foundation-models.md
      - 7. Probabilistic and generative modeling:
          - topics/07-generative-models/README.md
          - 7.1 Probabilistic modeling: topics/07-generative-models/1-probabilistic-modeling.md
          - 7.2 Variational autoencoders: topics/07-generative-models/2-vaes.md
          - 7.3 Generative adversarial networks: topics/07-generative-models/3-gans.md
          - 7.4 Normalizing flows: topics/07-generative-models/4-normalizing-flows.md
          - 7.5 Diffusion and score-based models: topics/07-generative-models/5-diffusion.md
      - 8. Uncertainty and calibration: topics/08-uncertainty/README.md
      - 9. Interpretable architectures: topics/09-interpretable-architectures/README.md
      - 10. Model explainability: topics/10-explainability/README.md
      - 11. World and agent models: topics/11-world-models/README.md
  - Final assignment:
      - final-assignment/README.md
      - Getting started:
          - Setup: final-assignment/docs/setup.md
          - Snellius: final-assignment/docs/snellius.md
      - Tracks:
          - Dice: final-assignment/segmentation/README.md
          - Consistency: final-assignment/consistency/README.md
          - Real-time: final-assignment/realtime/README.md
          - Generative: final-assignment/generative/README.md
      - Submitting: final-assignment/docs/submission.md
      - Report, pitch & grading: final-assignment/docs/report.md
      - FAQ: final-assignment/docs/faq.md

plugins:
  - same-dir
  - search

hooks:
  - .github/mkdocs_hooks.py

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs          # Home | Topics | Final assignment
    - navigation.indexes       # a section's first page is its overview
    - navigation.footer        # previous / next links at the bottom of every page
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - github-callouts           # GitHub alerts (> [!NOTE]) render as boxes on the site too
  - attr_list
  - md_in_html
  - tables
  - footnotes                 # citations in lecture notes: [^key]
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:          # ```mermaid blocks become diagrams, as on GitHub
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - website/mathjax.js          # MathJax settings; must load before MathJax itself
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js   # TeX input only

validation:
  links:
    not_found: warn
    anchors: warn
