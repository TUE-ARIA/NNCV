# Documentation website, built from the Markdown files in `Final assignment/`.
# Preview locally:  pip install -r docs-requirements.txt && mkdocs serve
# Published to GitHub Pages by .github/workflows/docs.yml on every push to main.
site_name: "5LSM0 Final Assignment: ATLAS Surgical Video Challenge"
site_url: https://tue-aria.github.io/NNCV/
repo_url: https://github.com/TUE-ARIA/NNCV
repo_name: TUE-ARIA/NNCV
edit_uri: edit/main/Final%20assignment/

docs_dir: Final assignment
# Only Markdown pages and images become part of the site; links to code go to GitHub (see hooks).
exclude_docs: |
  *
  !*.md
  !*.png

nav:
  - Overview: README.md
  - Getting started:
      - Setup: docs/setup.md
      - Snellius: docs/snellius.md
  - Tracks:
      - Dice: segmentation/README.md
      - Consistency: consistency/README.md
      - Real-time: realtime/README.md
      - Generative: generative/README.md
  - Submitting: docs/submission.md
  - Report, pitch & grading: docs/report.md
  - FAQ: docs/faq.md

hooks:
  - .github/mkdocs_hooks.py

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.footer        # previous / next links at the bottom of every page
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - github-callouts           # GitHub alerts (> [!NOTE]) render as boxes on the site too
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

validation:
  links:
    not_found: warn
    anchors: warn
