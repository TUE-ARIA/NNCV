# Builds the base images for challenge submissions and publishes them to the GitHub Container Registry,
# where students (local tests, Snellius) and the challenge server pull the same images.
name: Base images

on:
  push:
    branches: [main]
    paths: ["final-assignment/docker/**", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/tue-aria
  TAG: "2027"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Free disk space          # the CUDA base images are large
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      # in order: each image builds on the previous one
      - name: pytorch
        run: |
          docker build -t $REGISTRY/nncv-pytorch:$TAG final-assignment/docker/pytorch
          docker push $REGISTRY/nncv-pytorch:$TAG
      - name: transformers
        run: |
          docker build --build-arg BASE=$REGISTRY/nncv-pytorch:$TAG -t $REGISTRY/nncv-transformers:$TAG final-assignment/docker/transformers
          docker push $REGISTRY/nncv-transformers:$TAG
      - name: generative
        run: |
          docker build --build-arg BASE=$REGISTRY/nncv-transformers:$TAG -t $REGISTRY/nncv-generative:$TAG final-assignment/docker/generative
          docker push $REGISTRY/nncv-generative:$TAG
